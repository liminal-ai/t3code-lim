# Read from the PR's BASE branch (a PR cannot change its own review settings).
version: 1
triggers:
  drafts: false
  frequency: oncePerPr      # re-run manually with a `bugbot run` comment; avoids ~$1–1.50 per push
review:
  effort: default           # low | default | high | smart (effort levels may require usage-based plan)
  incremental: true
prSummary:
  mode: disabled            # Copilot already posts an overview; avoid multiple summaries
  riskScore: false
autofix:
  mode: existingBranch      # apply autofixes to the existing PR branch
